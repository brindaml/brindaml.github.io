<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@kuchikopi's game library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.cloudflare.steamstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="journal.css?v=26">
</head>
<body class="journal">

  <div class="paper-texture" aria-hidden="true"></div>

  <div class="decor" aria-hidden="true">
    <svg class="doodle doodle-plant" viewBox="0 0 60 70">
      <path d="M30 68V38" stroke="#7c9473" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M30 46c-10-2-16-12-14-22 10 2 16 12 14 22Z" fill="#a8c3a0"/>
      <path d="M30 40c9-3 14-13 11-23-9 3-14 13-11 23Z" fill="#8fb086"/>
      <path d="M30 52c-8 0-13-8-12-16 8 1 13 9 12 16Z" fill="#93b58a"/>
      <path d="M14 68h32l-3-14H17Z" fill="#e8b4bc"/>
      <path d="M17 58h26" stroke="#d99aa4" stroke-width="1.5"/>
    </svg>
    <svg class="doodle doodle-cup" viewBox="0 0 50 46">
      <path d="M8 16h28v14a14 14 0 0 1-28 0Z" fill="#f0c199"/>
      <path d="M36 20h4a6 6 0 0 1 0 12h-4" fill="none" stroke="#c98f57" stroke-width="3"/>
      <path d="M14 10c1-3-1-4 0-7M22 10c1-3-1-4 0-7M30 10c1-3-1-4 0-7" stroke="#c9b8a3" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>
    <svg class="doodle doodle-star doodle-star-1" viewBox="0 0 24 24"><path d="M12 1l2.6 7.9H23l-6.7 4.9L18.9 22 12 16.6 5.1 22l2.6-7.2L1 8.9h8.4Z" fill="#e8b4bc"/></svg>
    <svg class="doodle doodle-star doodle-star-2" viewBox="0 0 24 24"><path d="M12 1l2.6 7.9H23l-6.7 4.9L18.9 22 12 16.6 5.1 22l2.6-7.2L1 8.9h8.4Z" fill="#c7b8e0"/></svg>
    <svg class="doodle doodle-heart" viewBox="0 0 24 22"><path d="M12 21S1 14 1 7a6 6 0 0 1 11-3 6 6 0 0 1 11 3c0 7-11 14-11 14Z" fill="#e8b4bc"/></svg>
    <svg class="doodle doodle-cloud" viewBox="0 0 80 40">
      <path d="M15 32a12 12 0 0 1-2-24 15 15 0 0 1 29-6 12 12 0 0 1 16 16 10 10 0 0 1-3 20H15Z" fill="#fdf9f0"/>
    </svg>
  </div>

  <main>
    <header class="profile">
      <div class="polaroid avatar-polaroid">
        <span class="tape tape-a"></span>
        <span class="tape tape-b"></span>
        <svg class="avatar" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="30" cy="18" r="11" fill="#6fce5a"/>
          <circle cx="70" cy="18" r="11" fill="#6fce5a"/>
          <path d="M50 10C28 10 16 30 16 54c0 24 15 38 34 38s34-14 34-38C84 30 72 10 50 10Z" fill="#6fce5a"/>
          <ellipse cx="38" cy="50" rx="10" ry="13" fill="#fff"/>
          <ellipse cx="62" cy="50" rx="10" ry="13" fill="#fff"/>
          <circle cx="38" cy="52" r="3.4" fill="#14231a"/>
          <circle cx="62" cy="52" r="3.4" fill="#14231a"/>
          <path d="M42 74h16" stroke="#14231a" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="profile-text">
        <h1>@kuchikopi</h1>
        <p class="tagline">49 games and counting</p>
      </div>
    </header>

    <div class="view-toggle" id="view-toggle" role="tablist">
      <button type="button" data-view="shelf" class="active">Shelf</button>
      <button type="button" data-view="timeline">Timeline</button>
      <button type="button" data-view="playtime">Playtime</button>
    </div>

    <div id="library-root"></div>

  </main>

  <script src="library-data.js?v=26"></script>
  <script src="library.js?v=26"></script>
</body>
</html>
